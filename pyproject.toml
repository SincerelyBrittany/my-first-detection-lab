[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detectionlab"
version = "0.1.0"
description = "Detection-as-code: Sigma rules for Windows (Sysmon) and AWS CloudTrail, tested in CI."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pysigma>=0.11"]

[tool.setuptools.packages.find]
include = ["detectionlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
